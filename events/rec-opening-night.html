<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Rec Room Opening Night — CTRL 3 Media Inc.</title>
  <link rel="icon" type="image/x-icon" href="https://base44.app/api/apps/6a089110f76438ad64364898/files/mp/public/6a089110f76438ad64364898/a2faa19de_favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --bg-card: #0e0e0e;
      --accent: #00c9a7;
      --text: #e8e8e8;
      --text-dim: #666;
      --text-faint: #333;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(0,201,167,0.3);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(0,201,167,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background: rgba(8,8,8,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    nav .nav-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--text);
      text-decoration: none;
    }
    nav .nav-logo span { color: var(--accent); }

    nav .nav-back {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.25s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    nav .nav-back:hover { color: var(--accent); }

    /* ── HERO ── */
    .project-hero {
      position: relative;
      height: 60vh;
      min-height: 400px;
      overflow: hidden;
      margin-top: 72px;
    }

    .project-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
    }

    .project-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 30%, var(--bg) 100%);
    }

    .project-hero-content {
      position: absolute;
      bottom: 60px;
      left: 0; right: 0;
      z-index: 2;
      padding: 0 40px;
      max-width: 800px;
    }

    .project-category {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .project-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .project-desc {
      font-size: 15px;
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 600px;
    }

    /* ── GALLERY ── */
    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px 80px;
      position: relative;
      z-index: 1;
    }

    .gallery-grid {
      column-count: 3;
      column-gap: 16px;
    }

    .gallery-grid img {
      width: 100%;
      margin-bottom: 16px;
      border-radius: 8px;
      break-inside: avoid;
      display: block;
      cursor: pointer;
      transition: transform 0.3s, opacity 0.3s;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .gallery-grid img:hover { transform: scale(1.02); opacity: 0.85; }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 200;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 24px; right: 32px;
      font-size: 28px;
      color: var(--text-dim);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }
    footer a {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
    }
    footer a:hover { color: var(--accent); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .project-hero { height: 45vh; min-height: 300px; margin-top: 60px; }
      .project-hero-content { bottom: 30px; padding: 0 20px; }
      .gallery { padding: 40px 20px 60px; }
      .gallery-grid { column-count: 1; column-gap: 12px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">CTRL<span>3</span></a>
    <a href="/" class="nav-back">← Back to Home</a>
  </nav>

  <section class="project-hero">
    <img src="/assets/events/rec-opening/rec-opening_01.jpg" alt="The Rec Room Opening Night" />
    <div class="project-hero-content">
      <div class="project-category">Launch Party</div>
      <h1 class="project-title">The Rec Room Opening Night</h1>
      <p class="project-desc">The official launch of The Rec Room, CTRL 3 Media's premier production studio in Mandaluyong City. A night celebrating the opening of a space designed for content creation, events, and community.</p>
    </div>
  </section>

  <section class="gallery">
    <div class="gallery-grid">
      <img src="/assets/events/rec-opening/rec-opening_02.jpg" alt="The Rec Room Opening Night photo 1" loading="lazy" data-idx="0" />
      <img src="/assets/events/rec-opening/rec-opening_03.jpg" alt="The Rec Room Opening Night photo 2" loading="lazy" data-idx="1" />
      <img src="/assets/events/rec-opening/rec-opening_04.jpg" alt="The Rec Room Opening Night photo 3" loading="lazy" data-idx="2" />
      <img src="/assets/events/rec-opening/rec-opening_05.jpg" alt="The Rec Room Opening Night photo 4" loading="lazy" data-idx="3" />
      <img src="/assets/events/rec-opening/rec-opening_06.jpg" alt="The Rec Room Opening Night photo 5" loading="lazy" data-idx="4" />
      <img src="/assets/events/rec-opening/rec-opening_09.jpg" alt="The Rec Room Opening Night photo 6" loading="lazy" data-idx="5" />
      <img src="/assets/events/rec-opening/rec-opening_10.jpg" alt="The Rec Room Opening Night photo 7" loading="lazy" data-idx="6" />
      <img src="/assets/events/rec-opening/rec-opening_11.jpg" alt="The Rec Room Opening Night photo 8" loading="lazy" data-idx="7" />
      <img src="/assets/events/rec-opening/rec-opening_14.jpg" alt="The Rec Room Opening Night photo 9" loading="lazy" data-idx="8" />
      <img src="/assets/events/rec-opening/rec-opening_15.jpg" alt="The Rec Room Opening Night photo 10" loading="lazy" data-idx="9" />
      <img src="/assets/events/rec-opening/rec-opening_16.jpg" alt="The Rec Room Opening Night photo 11" loading="lazy" data-idx="10" />
      <img src="/assets/events/rec-opening/rec-opening_17.jpg" alt="The Rec Room Opening Night photo 12" loading="lazy" data-idx="11" />
      <img src="/assets/events/rec-opening/rec-opening_18.jpg" alt="The Rec Room Opening Night photo 13" loading="lazy" data-idx="12" />
      <img src="/assets/events/rec-opening/rec-opening_01.jpg" alt="The Rec Room Opening Night photo 14" loading="lazy" data-idx="13" />
      <img src="/assets/events/rec-opening/rec-opening_07.jpg" alt="The Rec Room Opening Night photo 15" loading="lazy" data-idx="14" />
      <img src="/assets/events/rec-opening/rec-opening_08.jpg" alt="The Rec Room Opening Night photo 16" loading="lazy" data-idx="15" />
      <img src="/assets/events/rec-opening/rec-opening_12.jpg" alt="The Rec Room Opening Night photo 17" loading="lazy" data-idx="16" />
      <img src="/assets/events/rec-opening/rec-opening_13.jpg" alt="The Rec Room Opening Night photo 18" loading="lazy" data-idx="17" />
    </div>
  </section>

  <div class="lightbox" onclick="this.classList.remove('active')">
    <span class="lightbox-close">×</span>
    <img src="" id="lightbox-img" />
  </div>

  <footer>
    <a href="/">← Back to All Projects</a>
  </footer>

  <script>
    document.querySelectorAll('.gallery-grid img').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        const lb = document.querySelector('.lightbox');
        document.getElementById('lightbox-img').src = e.target.src;
        lb.classList.add('active');
      });
      img.style.animationDelay = (img.dataset.idx * 0.08) + 's';
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.querySelector('.lightbox').classList.remove('active');
    });
  </script>
</body>
</html>
