<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTRL 3 Media — Clock In/Out</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      color: #00c9a7;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-card {
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    #locationStatus {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .distance-badge {
      display: inline-block;
      background: rgba(0,201,167,0.1);
      color: #00c9a7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .distance-badge.outside {
      background: rgba(255,80,80,0.1);
      color: #ff5050;
    }
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-in {
      background: #00c9a7;
      color: #000;
    }
    .btn-in:hover { background: #00b596; }
    .btn-in:disabled {
      background: #1a2a26;
      color: #445;
      cursor: not-allowed;
    }
    .btn-out {
      background: #1a1a1a;
      color: #e8e8e8;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-out:hover { background: #222; }
    .btn-out:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
    }
    .result.success {
      display: block;
      background: rgba(0,201,167,0.08);
      border: 1px solid rgba(0,201,167,0.2);
      color: #00c9a7;
    }
    .result.error {
      display: block;
      background: rgba(255,80,80,0.08);
      border: 1px solid rgba(255,80,80,0.2);
      color: #ff5050;
    }
    .timestamp {
      font-size: 0.75rem;
      color: #666;
      margin-top: 8px;
    }
    .employee-name {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 16px;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #333;
      border-top-color: #00c9a7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">CTRL 3 MEDIA</div>
    <div class="subtitle">Employee Time Clock</div>

    <div class="status-card">
      <div class="employee-name">Ronnie Rebenito</div>
      <div id="locationStatus"><span class="spinner"></span>Getting your location...</div>
      <div id="distanceBadge" class="distance-badge" style="display:none;"></div>
      <br>
      <button class="btn btn-in" id="clockInBtn" disabled>CLOCK IN</button>
      <button class="btn btn-out" id="clockOutBtn" disabled>CLOCK OUT</button>
      <div id="result" class="result"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://veronica-64364898.base44.app/functions/clockInOut';
    const REC_LAT = 14.5823719;
    const REC_LON = 121.0511156;
    const GEOFENCE_M = 100;
    const EMPLOYEE = 'Ronnie Rebenito';
    const PIN = 'ctrl3clock';

    let userLat = null;
    let userLon = null;
    let distanceFromRec = null;

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    const statusEl = document.getElementById('locationStatus');
    const distEl = document.getElementById('distanceBadge');
    const inBtn = document.getElementById('clockInBtn');
    const outBtn = document.getElementById('clockOutBtn');
    const resultEl = document.getElementById('result');

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        distanceFromRec = haversine(REC_LAT, REC_LON, userLat, userLon);

        const within = distanceFromRec <= GEOFENCE_M;
        distEl.style.display = 'inline-block';
        distEl.textContent = `${Math.round(distanceFromRec)}m from Rec Room`;
        distEl.classList.toggle('outside', !within);

        if (within) {
          statusEl.innerHTML = `✓ You're at The Rec Room. Ready to clock.`;
          statusEl.style.color = '#00c9a7';
          inBtn.disabled = false;
          outBtn.disabled = false;
        } else {
          statusEl.innerHTML = `✗ You're too far from The Rec Room (${Math.round(distanceFromRec)}m). Must be within ${GEOFENCE_M}m.`;
          statusEl.style.color = '#ff5050';
        }
      },
      (err) => {
        statusEl.innerHTML = 'Could not get your location. Please enable location access.';
        statusEl.style.color = '#ff5050';
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );

    async function punch(action) {
      inBtn.disabled = true;
      outBtn.disabled = true;
      resultEl.className = 'result';
      resultEl.innerHTML = '<span class="spinner"></span>Logging...';

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            employee_name: EMPLOYEE,
            action: action,
            latitude: userLat,
            longitude: userLon,
            device_info: navigator.userAgent.substring(0, 100),
            pin: PIN
          })
        });
        const data = await resp.json();

        if (data.success && data.within_geofence) {
          resultEl.className = 'result success';
          resultEl.innerHTML = `✓ ${data.message}<div class="timestamp">${data.timestamp}</div>`;
        } else if (data.success && !data.within_geofence) {
          resultEl.className = 'result error';
          resultEl.innerHTML = `✗ ${data.message}`;
        } else {
          resultEl.className = 'result error';
          resultEl.innerHTML = `✗ ${data.message || 'Something went wrong.'}`;
        }
      } catch (err) {
        resultEl.className = 'result error';
        resultEl.innerHTML = '✗ Network error. Try again.';
      }

      if (distanceFromRec !== null && distanceFromRec <= GEOFENCE_M) {
        inBtn.disabled = false;
        outBtn.disabled = false;
      }
    }

    inBtn.addEventListener('click', () => punch('IN'));
    outBtn.addEventListener('click', () => punch('OUT'));
  </script>
</body>
</html>
